[package]
name = "pcl-auth"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
[dependencies]
pcl-network = { path = "../network" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Explicit stores are required: keyring otherwise silently chooses a mock store.
# Keep service/account identifiers stable so existing credentials remain readable.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
