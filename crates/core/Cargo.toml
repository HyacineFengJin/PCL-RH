[package]
name = "pcl-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
md5 = "0.7"
sha2 = "0.10"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[[test]]
name = "java_probe_lifecycle"
path = "tests/java_probe_lifecycle.rs"
harness = false

[[test]]
name = "game_process_lifecycle"
path = "tests/game_process_lifecycle.rs"
harness = false
