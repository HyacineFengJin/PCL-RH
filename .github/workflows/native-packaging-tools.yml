name: Native packaging tools

on:
  push:
    branches: [master]
    paths: ['tools/*native.py', 'tools/ci/verify-native-*.py', 'tools/ci/fetch-native-candidate.py', 'tools/ci/prepare-system-node.py', 'tools/ci/prepare-game-installation.py', 'tools/ci/verify-linux-package.py', 'tools/ci/macos-window-smoke.py', 'tools/ci/collect-game-evidence.py', 'tools/ci/game-acceptance.py', 'tools/ci/game-acceptance/**', 'tools/installer-languages/**', 'tools/licenses/**', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/build_metadata.rs', 'start-native.*', '.gitattributes', '.github/workflows/native-packaging-tools.yml', '.github/workflows/macos-distribution.yml', '.github/workflows/windows-installer.yml', '.github/workflows/linux-distribution.yml', '.github/workflows/game-acceptance.yml']
  pull_request:
    paths: ['tools/*native.py', 'tools/ci/verify-native-*.py', 'tools/ci/fetch-native-candidate.py', 'tools/ci/prepare-system-node.py', 'tools/ci/prepare-game-installation.py', 'tools/ci/verify-linux-package.py', 'tools/ci/macos-window-smoke.py', 'tools/ci/collect-game-evidence.py', 'tools/ci/game-acceptance.py', 'tools/ci/game-acceptance/**', 'tools/installer-languages/**', 'tools/licenses/**', 'apps/desktop/src-tauri/build.rs', 'apps/desktop/src-tauri/build_metadata.rs', 'start-native.*', '.gitattributes', '.github/workflows/native-packaging-tools.yml', '.github/workflows/macos-distribution.yml', '.github/workflows/windows-installer.yml', '.github/workflows/linux-distribution.yml', '.github/workflows/game-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-packaging-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Packaging tools / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare Rust for the incremental identity fixture
        run: rustup toolchain install stable --profile minimal
      - name: Test actual temporary files and archive round trips
        # Synthetic archives and one std-only incremental Cargo fixture.
        # Never starts a launcher window, game, Node host or AI.
        run: python -m unittest discover -s tools -p 'test_*native.py'
      - name: Verify attribution bytes on this native checkout
        run: python tools/licenses/release.py --check
      - name: Test client evidence assessment without starting a game
        run: python -m unittest discover -s tools/ci/game-acceptance -p 'test_*.py'
      - name: Parse the Windows launcher entry
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'start-native.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Report the native Python and Git versions
        run: |
          python --version
          git --version
