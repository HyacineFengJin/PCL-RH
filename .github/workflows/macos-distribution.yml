name: macOS app distribution

# Build a standalone app and disk image from an authenticated native producer.
# All launches and system-runtime preparation use disposable runner storage.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed official-native run containing both macOS release portable artifacts
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-distribution-${{ github.ref }}-${{ inputs.source_run }}
  cancel-in-progress: false

jobs:
  dmg:
    if: github.repository == 'HyacineFengJin/PCL-RH' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download the authenticated native portable producer
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/fetch-native-candidate.py --source-run "$SOURCE_RUN" --evidence target/native-dmg/source-run.json
      - name: Prepare the native host's fixed Node runtime on this disposable runner
        run: python tools/ci/prepare-system-node.py
      - name: Verify original native binaries and runtime resources
        run: python tools/ci/verify-native-package.py --directory target/native-packages
      - name: Build the standalone application
        run: python tools/app-native.py --directory target/native-packages --output target/native-app
      - name: Verify read-only resources, separate data and the LaunchServices entry
        run: python tools/ci/verify-native-app.py --directory target/native-app --portable target/native-packages
      - name: Open and normally close the owned native application window
        run: |
          python - <<'PY'
          import importlib.util, json, os, subprocess, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('app', 'tools/app-native.py')
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          root = Path(os.environ['RUNNER_TEMP']) / 'pcl-rh-native-gui'
          root.mkdir(mode=0o700)
          bundle = app.unpack(Path('target/native-app/mac-app.tar.gz').resolve(), root)
          subprocess.run([sys.executable, 'tools/ci/macos-window-smoke.py', '--bundle', str(bundle),
                          '--data', str(root / 'data'), '--output', str(root / 'evidence')], check=True)
          app.verify_bundle(bundle, json.loads(Path('target/native-app/app-manifest.json').read_bytes()))
          PY
      # The independently verified .app remains usable even if disk-image
      # creation later fails. Each format still requires its own full checks.
      - name: Save the verified standalone application
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ matrix.os }}
          path: target/native-app/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Build the application disk image
        run: python tools/dmg-native.py --directory target/native-packages --output target/native-dmg --app-directory target/native-app
      - name: Mount and verify the copied installed application
        run: python tools/ci/verify-native-dmg.py --directory target/native-dmg --portable target/native-packages --app-directory target/native-app
      - name: Save the verified disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-dmg-${{ matrix.os }}
          path: |
            target/native-dmg/*.dmg
            target/native-dmg/*.sha256
            target/native-dmg/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save distribution diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-distribution-diagnostics-${{ matrix.os }}
          path: |
            target/native-dmg/*.json
            target/native-app/*.json
            ${{ runner.temp }}/pcl-rh-native-gui/evidence/*
          if-no-files-found: ignore
          retention-days: 7
