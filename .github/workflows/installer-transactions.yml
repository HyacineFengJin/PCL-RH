name: Installer transactions

on:
  push:
    branches: [master]
    paths: ['crates/install/**', 'apps/desktop/src-tauri/src/java_download.rs', 'apps/desktop/src-tauri/src/java_download/**', 'apps/desktop/src-tauri/src/resource_save.rs', 'apps/desktop/src-tauri/src/resource_save/**', 'apps/desktop/src-tauri/src/resource_digest.rs', 'apps/desktop/src-tauri/src/tasks.rs', 'apps/desktop/src-tauri/src/tasks/**', 'apps/desktop/src-tauri/src/toolbox_download.rs', 'apps/desktop/src-tauri/src/toolbox_download/**', 'apps/desktop/src-tauri/src/instance_export.rs', 'apps/desktop/src-tauri/src/instance_export/**', 'apps/desktop/src-tauri/src/export_presets.rs', 'apps/desktop/src-tauri/src/export_presets/**', 'apps/desktop/src-tauri/src/instance_import.rs', 'apps/desktop/src-tauri/src/instance_import/**', 'apps/desktop/src-tauri/src/launcher_local/**', 'crates/core/**', 'crates/network/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/installer-transactions.yml']
  pull_request:
    paths: ['crates/install/**', 'apps/desktop/src-tauri/src/java_download.rs', 'apps/desktop/src-tauri/src/java_download/**', 'apps/desktop/src-tauri/src/resource_save.rs', 'apps/desktop/src-tauri/src/resource_save/**', 'apps/desktop/src-tauri/src/resource_digest.rs', 'apps/desktop/src-tauri/src/tasks.rs', 'apps/desktop/src-tauri/src/tasks/**', 'apps/desktop/src-tauri/src/toolbox_download.rs', 'apps/desktop/src-tauri/src/toolbox_download/**', 'apps/desktop/src-tauri/src/instance_export.rs', 'apps/desktop/src-tauri/src/instance_export/**', 'apps/desktop/src-tauri/src/export_presets.rs', 'apps/desktop/src-tauri/src/export_presets/**', 'apps/desktop/src-tauri/src/instance_import.rs', 'apps/desktop/src-tauri/src/instance_import/**', 'apps/desktop/src-tauri/src/launcher_local/**', 'crates/core/**', 'crates/network/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/installer-transactions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-transactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transactions:
    name: Installer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile the complete production installer on its native host
        run: cargo +stable check --locked -p pcl-install --lib
      - name: Test installer publication and recovery
        shell: bash
        # Only Linux's Landlock tests compile/run synthetic processor fixtures.
        # Every host runs the real installer, HTTP/native archive/retained root,
        # staging registry, repair/recovery tests; no real game/JVM is downloaded.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            java -version
            javac -version
          fi
          cargo +stable test --locked -p pcl-install --lib -- --test-threads=2
      - name: Test native Java store adapters without a JVM download
        run: cargo +stable test --locked -p pcl-install --test java_download_native --test resource_save_files --no-fail-fast -- --test-threads=2
      - name: Test actual export service, presets and import filesystem
        # The import target covers actual native files, durable staging and ZIP
        # parsing. It does not stand in for full pack-service orchestration.
        run: cargo +stable test --locked -p pcl-install --test instance_export --test instance_import_files --no-fail-fast -- --test-threads=2
      - name: Test native task coordination and toolbox download service
        # Real scheduling/session/HTTP/publication code, private synthetic files.
        run: cargo +stable test --locked -p pcl-install --test tasks_scope --test toolbox_download --no-fail-fast -- --test-threads=2
      - name: Report host toolchain
        run: rustc +stable -vV
      # Native installer tests are not evidence of a complete desktop app or of
      # non-Linux Java-processor confinement; unsupported batches must fail.
