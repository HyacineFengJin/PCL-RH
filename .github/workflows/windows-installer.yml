name: Windows installer verification

# Reuse an official candidate's verified portable payload without compiling it.
# This installs only on a disposable runner, never on a user's computer.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed official-native run containing the Windows release portable artifact
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-installer-${{ github.ref }}-${{ inputs.source_run }}
  cancel-in-progress: false

jobs:
  installer:
    if: github.repository == 'HyacineFengJin/PCL-RH' && github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate the official producer and download its fixed Windows artifact
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/fetch-native-candidate.py --source-run "$SOURCE_RUN"
      - name: Verify the original portable payload with the actual native binaries
        run: python tools/ci/verify-native-package.py --directory target/native-packages
      - name: Build a per-user Windows installer
        run: python tools/installer-native.py --directory target/native-packages --output target/native-installers
      - name: Prepare WebView2 on the disposable runner
        shell: pwsh
        run: ./tools/ci/prepare-webview2.ps1
      - name: Verify installation, occupied files and data-preserving uninstall
        run: python tools/ci/verify-native-installer.py --directory target/native-installers --portable target/native-packages
      - name: Save the verified Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-user-installer-retest
          path: |
            target/native-installers/*.exe
            target/native-installers/*.sha256
            target/native-installers/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save installer diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-retest-diagnostics
          path: |
            target/native-installers/*.json
            target/native-installers/*.log
            target/native-installers/window-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
