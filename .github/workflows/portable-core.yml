name: Portable core

on:
  push:
    branches: [master]
    paths: ['crates/core/**', 'crates/auth/**', 'crates/network/**', 'crates/install/src/repair_evidence.rs', 'crates/install/src/repair_lock.rs', 'crates/install/src/repair_staging.rs', 'crates/install/src/repair_staging_tests.rs', 'apps/desktop/src-tauri/src/document_io.rs', 'apps/desktop/src-tauri/src/toolbox_images/publish.rs', 'apps/desktop/src-tauri/src/toolbox_images/publish/**', 'apps/desktop/src-tauri/src/instance_rename_refs.rs', 'apps/desktop/src-tauri/src/instance_rename_refs/**', 'apps/desktop/src-tauri/src/local_resource_info/files.rs', 'apps/desktop/src-tauri/src/local_resource_info/files/**', 'apps/desktop/src-tauri/src/resource_ops/token.rs', 'apps/desktop/src-tauri/src/launcher_memory.rs', 'apps/desktop/src-tauri/src/launcher_memory/**', 'apps/desktop/src-tauri/src/launcher_node.rs', 'apps/desktop/src-tauri/src/launcher_local.rs', 'apps/desktop/src-tauri/src/launcher_document.rs', 'apps/desktop/src-tauri/src/instance_meta.rs', 'apps/desktop/src-tauri/src/instance_meta/**', 'apps/desktop/src-tauri/src/instance_logs.rs', 'apps/desktop/src-tauri/src/instance_logs/**', 'apps/desktop/src-tauri/src/instance_delete/project_gate.rs', 'apps/desktop/src-tauri/src/instance_delete/project_gate_harness.rs', 'apps/desktop/src-tauri/src/instance_delete/filesystem.rs', 'apps/desktop/src-tauri/src/instance_delete/filesystem/**', 'apps/desktop/src-tauri/src/launcher_document/**', 'apps/desktop/src-tauri/src/launcher_assets.rs', 'apps/desktop/src-tauri/src/launcher_assets/**', 'apps/desktop/src-tauri/src/launcher_logs.rs', 'apps/desktop/src-tauri/src/launcher_logs/**', 'apps/desktop/src-tauri/src/launcher_local/**', 'apps/desktop/src-tauri/src/launcher_game_monitor.rs', 'apps/desktop/src-tauri/src/launcher_game_monitor/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/portable-core.yml']
  pull_request:
    paths: ['crates/core/**', 'crates/auth/**', 'crates/network/**', 'crates/install/src/repair_evidence.rs', 'crates/install/src/repair_lock.rs', 'crates/install/src/repair_staging.rs', 'crates/install/src/repair_staging_tests.rs', 'apps/desktop/src-tauri/src/document_io.rs', 'apps/desktop/src-tauri/src/toolbox_images/publish.rs', 'apps/desktop/src-tauri/src/toolbox_images/publish/**', 'apps/desktop/src-tauri/src/instance_rename_refs.rs', 'apps/desktop/src-tauri/src/instance_rename_refs/**', 'apps/desktop/src-tauri/src/local_resource_info/files.rs', 'apps/desktop/src-tauri/src/local_resource_info/files/**', 'apps/desktop/src-tauri/src/resource_ops/token.rs', 'apps/desktop/src-tauri/src/launcher_memory.rs', 'apps/desktop/src-tauri/src/launcher_memory/**', 'apps/desktop/src-tauri/src/launcher_node.rs', 'apps/desktop/src-tauri/src/launcher_local.rs', 'apps/desktop/src-tauri/src/launcher_document.rs', 'apps/desktop/src-tauri/src/instance_meta.rs', 'apps/desktop/src-tauri/src/instance_meta/**', 'apps/desktop/src-tauri/src/instance_logs.rs', 'apps/desktop/src-tauri/src/instance_logs/**', 'apps/desktop/src-tauri/src/instance_delete/project_gate.rs', 'apps/desktop/src-tauri/src/instance_delete/project_gate_harness.rs', 'apps/desktop/src-tauri/src/instance_delete/filesystem.rs', 'apps/desktop/src-tauri/src/instance_delete/filesystem/**', 'apps/desktop/src-tauri/src/launcher_document/**', 'apps/desktop/src-tauri/src/launcher_assets.rs', 'apps/desktop/src-tauri/src/launcher_assets/**', 'apps/desktop/src-tauri/src/launcher_logs.rs', 'apps/desktop/src-tauri/src/launcher_logs/**', 'apps/desktop/src-tauri/src/launcher_local/**', 'apps/desktop/src-tauri/src/launcher_game_monitor.rs', 'apps/desktop/src-tauri/src/launcher_game_monitor/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/portable-core.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test portable crates on their native host
        run: cargo +stable test --locked -p pcl-core -p pcl-network -p pcl-auth
      - name: Test real JDK 21 with pinned Windows cwd
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME_21_X64)) {
            throw 'Windows runner must provide JAVA_HOME_21_X64 for real JVM validation'
          }
          foreach ($exe in @('java.exe', 'javac.exe')) {
            if (!(Test-Path -LiteralPath (Join-Path $env:JAVA_HOME_21_X64 "bin/$exe") -PathType Leaf)) {
              throw "Required JDK 21 executable missing: $exe"
            }
          }
          $env:PCL_TEST_WINDOWS_JAVA21_HOME = $env:JAVA_HOME_21_X64
          cargo +stable test --locked -p pcl-core --test windows_pinned_cwd java21_pinned_volume_guid_cwd_requires_java_user_dir -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report host toolchain
        run: rustc +stable -vV
      # Includes actual native desktop persistence adapters through focused
      # harnesses. It is not evidence of a complete Windows/macOS app build.
