name: Portable core

on:
  push:
    branches: [master]
    paths: ['crates/core/**', 'crates/auth/**', 'crates/network/**', 'crates/install/src/repair_evidence.rs', 'crates/install/src/repair_lock.rs', 'crates/install/src/repair_staging.rs', 'crates/install/src/repair_staging_tests.rs', 'apps/desktop/src-tauri/src/document_io.rs', 'apps/desktop/src-tauri/src/launcher_node.rs', 'apps/desktop/src-tauri/src/launcher_local.rs', 'apps/desktop/src-tauri/src/launcher_document.rs', 'apps/desktop/src-tauri/src/instance_meta.rs', 'apps/desktop/src-tauri/src/instance_meta/**', 'apps/desktop/src-tauri/src/instance_logs.rs', 'apps/desktop/src-tauri/src/instance_logs/**', 'apps/desktop/src-tauri/src/instance_delete/filesystem.rs', 'apps/desktop/src-tauri/src/instance_delete/filesystem/**', 'apps/desktop/src-tauri/src/launcher_document/**', 'apps/desktop/src-tauri/src/launcher_assets.rs', 'apps/desktop/src-tauri/src/launcher_assets/**', 'apps/desktop/src-tauri/src/launcher_logs.rs', 'apps/desktop/src-tauri/src/launcher_logs/**', 'apps/desktop/src-tauri/src/launcher_local/**', 'apps/desktop/src-tauri/src/launcher_game_monitor.rs', 'apps/desktop/src-tauri/src/launcher_game_monitor/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/portable-core.yml']
  pull_request:
    paths: ['crates/core/**', 'crates/auth/**', 'crates/network/**', 'crates/install/src/repair_evidence.rs', 'crates/install/src/repair_lock.rs', 'crates/install/src/repair_staging.rs', 'crates/install/src/repair_staging_tests.rs', 'apps/desktop/src-tauri/src/document_io.rs', 'apps/desktop/src-tauri/src/launcher_node.rs', 'apps/desktop/src-tauri/src/launcher_local.rs', 'apps/desktop/src-tauri/src/launcher_document.rs', 'apps/desktop/src-tauri/src/instance_meta.rs', 'apps/desktop/src-tauri/src/instance_meta/**', 'apps/desktop/src-tauri/src/instance_logs.rs', 'apps/desktop/src-tauri/src/instance_logs/**', 'apps/desktop/src-tauri/src/instance_delete/filesystem.rs', 'apps/desktop/src-tauri/src/instance_delete/filesystem/**', 'apps/desktop/src-tauri/src/launcher_document/**', 'apps/desktop/src-tauri/src/launcher_assets.rs', 'apps/desktop/src-tauri/src/launcher_assets/**', 'apps/desktop/src-tauri/src/launcher_logs.rs', 'apps/desktop/src-tauri/src/launcher_logs/**', 'apps/desktop/src-tauri/src/launcher_local/**', 'apps/desktop/src-tauri/src/launcher_game_monitor.rs', 'apps/desktop/src-tauri/src/launcher_game_monitor/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/portable-core.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test portable crates on their native host
        run: cargo +stable test --locked -p pcl-core -p pcl-network -p pcl-auth
      - name: Report host toolchain
        run: rustc +stable -vV
      # Includes actual native desktop persistence adapters through focused
      # harnesses. It is not evidence of a complete Windows/macOS app build.
