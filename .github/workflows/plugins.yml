name: Portable plugins

on:
  push:
    branches: [master]
    paths:
      [
        "experimental/extensions/**",
        "experimental/host.mjs",
        "experimental/agent-host.mjs",
        "apps/desktop/**",
        "code/**",
        ".github/workflows/plugins.yml",
      ]
  pull_request:
    paths:
      [
        "experimental/extensions/**",
        "experimental/host.mjs",
        "experimental/agent-host.mjs",
        "apps/desktop/**",
        "code/**",
        ".github/workflows/plugins.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  declarative-host:
    name: Plugins / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check declarative storage and the lightweight host
        run: node --test --test-reporter=tap experimental/extensions/tests/store-lifecycle.test.mjs experimental/extensions/tests/lightweight-host.test.mjs experimental/extensions/tests/compatibility.test.mjs experimental/extensions/tests/runtime-notices.test.mjs experimental/extensions/tests/settings.test.mjs experimental/extensions/tests/panels.test.mjs experimental/extensions/tests/launcher-components.test.mjs experimental/extensions/tests/schema-sync.test.mjs
      # This job neither loads AI providers nor builds the desktop application.

  product-webui:
    name: Bundled WebUI plugin host / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix apps/desktop --ignore-scripts --no-audit --no-fund
      - name: Check actual plugin entries, contributions and lifetimes
        run: |
          node apps/desktop/scripts/check-rh-code.mjs
          node apps/desktop/scripts/check-rh-code-scopes.mjs
          node apps/desktop/scripts/check-rh-code-dynamic-views.mjs
          node apps/desktop/scripts/check-product-plugins.mjs
          node apps/desktop/scripts/check-launcher-surfaces.mjs
          node --test apps/desktop/scripts/plugin-consumers.test.mjs apps/desktop/scripts/product-runtime.test.mjs apps/desktop/scripts/instance-snapshots.test.mjs apps/desktop/scripts/instance-copy.test.mjs apps/desktop/scripts/backup-restore.test.mjs apps/desktop/scripts/clipboard-discovery.test.mjs
          node apps/desktop/scripts/check-rh-code-host.mjs
      - name: Check prerequisite recovery and community UI lifetimes
        # Actual components with deferred synthetic IPC; no model or user data.
        run: node --test apps/desktop/scripts/extensions-launcher-ui.test.mjs apps/desktop/scripts/extensions-manager-ui.test.mjs apps/desktop/scripts/extensions-panels-ui.test.mjs apps/desktop/scripts/extensions-settings-ui.test.mjs
      - name: Check idle work, source lifetimes and bounded project witnesses
        # Synthetic source snapshots only. No SDK/model, native app or user data.
        run: |
          node --test apps/desktop/scripts/status-polling.test.mjs apps/desktop/scripts/task-polling.test.mjs apps/desktop/scripts/task-terminal-refresh-ui.test.mjs experimental/runtime/tests/porter-projects.test.mjs experimental/runtime/tests/source-release.test.mjs
          node apps/desktop/scripts/check-porter-source-owner.mjs
          node apps/desktop/scripts/check-rh-code-controller.mjs
      - name: Type check and build the WebUI
        run: npm run build --prefix apps/desktop
      # No native stores, game processes, AI providers or credentials are used.
