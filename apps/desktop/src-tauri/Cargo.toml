[package]
name = "pcl-desktop"
version = "0.2.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pcl-network = { path = "../../../crates/network" }
pcl-desktop-platform = { path = "../../../crates/desktop-platform" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dom_query = { version = "0.28.0", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
base64 = "0.22"
libc = "0.2"
sha2 = "0.10"
sha1 = "0.10"
semver = "1"
pcl-core = { path = "../../../crates/core" }
pcl-auth = { path = "../../../crates/auth" }
pcl-install = { path = "../../../crates/install" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros"] }

fastnbt = "2.6.3"
flate2 = "1"

png = "0.17.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
